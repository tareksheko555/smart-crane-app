name: smart_crane_app
description: "Smart Crane LMI & Lift Planner - Field Engineering Suite"
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # إنشاء وطباعة ومشاركة تقارير الـ PDF
  pdf: ^3.10.8
  printing: ^5.13.0
  share_plus: ^10.1.2
  path_provider: ^2.1.4
  intl: ^0.19.0

  # التوقيع الرقمي باللمس
  signature: ^5.4.1

  # التخزين وقاعدة البيانات المحلية
  sqflite: ^2.3.0
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # التشفير والتحقق من التراخيص
  crypto: ^3.0.3

  # الاتصال والمزامنة
  connectivity_plus: ^6.0.5
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
